services:
  mongo:
    image: mongo:6.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: simple
    ports:
      - "27017:27017"


  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: "mongodb://root:simple@mongo:27017/mydb?authSource=admin"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  mongo-data: